<header class="cabecalho navbar navbar-expand-lg navbar-dark bg-primary shadow-sm px-3">
    <div class="container-fluid">
        <!-- Logo / Título da Loja -->
        <h1 class="navbar-brand mb-0 h1">Minha Loja</h1>

        <!-- Botão Hambúrguer para Dispositivos Móveis -->
        <button 
            class="navbar-toggler" 
            type="button" 
            data-bs-toggle="collapse" 
            data-bs-target="#navbarNav" 
            aria-controls="navbarNav" 
            aria-expanded="false" 
            aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Itens do Menu e Carrinho que entram no menu hambúrguer no celular -->
        <div class="collapse navbar-collapse justify-content-end" [class.show]="menuAberto()" id="navbarNav">
            <nav class="navbar-nav align-items-lg-center gap-3">
                <a class="nav-link text-white" routerLink="/" (click)="menuAberto.set(false)">Início</a>
                <a class="nav-link text-white" routerLink="/checkout" (click)="menuAberto.set(false)">Checkout</a>
                <a class="nav-link text-white" href="#" (click)="menuAberto.set(false)">Contato</a>

                <!-- Bloco condicional do carrinho que você já utilizava -->
                @if (quantidade() > 0) {
                    <div class="d-flex flex-column align-items-center gap-2 mt-2 mt-lg-0">
                        <button type="button" (click)="cartService.alternarCarrinho(); menuAberto.set(false)" class="btn-carrinho-topo btn btn-warning text-dark fw-bold btn-sm w-100">
                            <span class="carrinho">🛒 Carrinho: {{ quantidade() }} itens ({{ valorTotal() | currency: 'BRL' }})</span>
                        </button>
                        <!-- Botão solicitado pelo exercício -->
                        <button type="button" class="btn btn-sm btn-danger w-100" (click)="esvaziarCarrinho(); ; menuAberto.set(false)">Esvaziar Carrinho</button>
                    </div>
                }
            </nav>
        </div>
    </div>
</header>
